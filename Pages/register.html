<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <a href="index.html"><img src="../Multimedia/new_cn_logo.svg">
        </a>
        <h2> Create an Account</h2>
    </header>

    <section id="registration-form">
        <form action="#" method="post">
            <fieldset>
                <legend> Personal Information </legend>
            <br/>

    <label for="name"> Full Name:</label>
    <input type="text" id="name" name="name" required />
    <br/>
    <br/>

    <label for="email"> Email:</label>
    <input type="text" id="email" name="email" required />
    <br/>
    <br/>

    <label for="name"> User Name:</label>
    <input type="text" id="Username" name="Username" required />
    <br/>
    <br/>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required />
    <br/>
    <br/>

    <label for="userType"> User Type:</label>
    <select id="userType" name="userType" required>
        <option value="" disabled selected> select user type </option>
        <option value="student"> Student</option>
        <option value="instructor">Instructors</option>
        </select>
        <br/>
        <br/>

        <label for="cpourse"> Select course:</label>
        <select id="course" name="course" required>
            <option value="course1">course 1 - Web_development</option>
            <option value="course2"> course 2 - Data Science Fundamentals</option>
            <option value="course3"> course 3 - Digital Marketing Mastery</option>
            <option value="course4"> course 4 - Android Development</option>
            </select>
            <br/>
            <br/>

            <button type="submit"> Register</button>
            </fieldset>
            </form>
        </section>
</body>
</html>
