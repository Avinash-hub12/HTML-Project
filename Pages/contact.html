<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Ninjas - Contact </title>
</head>
<body>
    <header>
        <a href="index.html"><img src="../Multimedia/new_cn_logo.svg">
        </a>
        <hr/>
        <section id="contact-info">
        <h2> Contact Detail </h2>
        <p>
            For inquiries, you can reach us via email or phone:
        </p>
        <p>
            Email:
            <a href="mailto:contact@codingninja.com">contact@codingninja.com
            </a>
        </p>
        <p>
            Phone:
            <a href="tel:1800-123-3598"> 1800-123-3598
            </a>
        </p>
        </section>
        <hr/>

        <section id="map">
            <h2> Location Map</h2>
            <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d898275.6257113806!2d75.836516246875!3d28.422601100000016!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d03d1c62ba76b%3A0xec4dbad7537d963b!2sCoding%20Ninjas!5e0!3m2!1sen!2sin!4v1750873266027!5m2!1sen!2sin" 
            width="600" height="450" style="border:0;"
             allowfullscreen="">
            </iframe>
        </section>
        <hr/>
        <section id="feedback">
            <form action="#" method="post">
        <br/>            
        <fieldset>
            <legend><b>Feedback Form</b></legend>
            <br/>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required />
            <br/>
            <br/>

            <label for="name">Email:</label>
            <input type="text" id="email" name="email" required />
            <br/>
            <br/>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required />
            <br/>
            <br/>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required >
            </textarea>
            <br/>
            <br/>
            <input type="submit" id="submit" value="submit"/>

        </fieldset>



    
    
</body>
</html>
